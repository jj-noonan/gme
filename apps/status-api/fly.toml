# fly launch already generates most of this — kept minimal and explicit here.
# Deploy from the repo root: fly deploy --config apps/status-api/fly.toml --dockerfile apps/status-api/Dockerfile

app = "gme-status-api"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  ALLOWED_ORIGINS = "https://greenmountain.express,https://www.greenmountain.express,https://jj-noonan.github.io,http://localhost:5173"
