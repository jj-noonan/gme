# fly launch already generates most of this — kept minimal and explicit here.
# Deploy from the repo root: fly deploy --config apps/status-api/fly.toml --dockerfile apps/status-api/Dockerfile

app = "gme-status-api"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Without this, Fly's proxy can route a cold-start request before the
  # Node process has bound to the port, surfacing as a 503 to the browser.
  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  # http:// variants are temporary: GitHub Pages' HTTPS cert for the custom
  # domain hasn't finished provisioning yet, so the site is still being
  # served over plain HTTP. Remove the http:// entries once HTTPS is
  # confirmed and enforced (see README).
  ALLOWED_ORIGINS = "https://greenmountain.express,https://www.greenmountain.express,http://greenmountain.express,http://www.greenmountain.express,https://jj-noonan.github.io,http://localhost:5173"
